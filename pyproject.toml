[project]
name = "nemotron-challenge"
version = "0.1.0"
description = "NVIDIA Nemotron Model Reasoning Challenge — solver-distilled SFT pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "datasets>=2.18.0",
    "accelerate>=0.29.0",
    "bitsandbytes>=0.43.0",
    "pandas>=2.0.0",
]

[tool.uv]
# The data pipeline (v5_*.py, solvers.py) is pure stdlib and needs none of the
# above — those are only required for training/eval on the GPU host (VM/Kaggle).
