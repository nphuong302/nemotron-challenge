[project]
name = "nemotron-challenge"
version = "0.1.0"
description = "NVIDIA Nemotron Model Reasoning Challenge — solver-distilled SFT pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "datasets>=2.18.0",
    "accelerate>=0.29.0",
    "bitsandbytes>=0.43.0",
    "pandas>=2.0.0",
]

# The pipeline scripts (makers/build_corpus/synth/assemble/curate/coverage) and
# solvers.py are pure stdlib — the deps above are only needed for training/eval
# on the GPU host (VM/Kaggle), not for local data work or CI.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Gate CI on real bugs (pyflakes + syntax), not stylistic noise. The compact
# inline style in solvers.py (bit-op tables) and the `drop; continue` pattern in
# curate.py are intentional.
select = ["E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
